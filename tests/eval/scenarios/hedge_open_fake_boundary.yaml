scenario: hedge_open_fake_boundary
kind: snap
description: >
  Issue 484 / the Issue-441 residual hedge class (video 7e988321 rank 12):
  a clip opened cold on "maybe" — a hedge that is deliberately NOT in the
  weak-opener list (no closed word class catches every hedge). The real
  defect is the boundary: the previous utterance ends "And I'm thinking"
  with no terminal punctuation and a 0.9 s pause, so "maybe he's…" is the
  same sentence, split by Deepgram on a pause. Merging the fake boundary
  moves the open back to "And I'm thinking maybe…" with the word list
  byte-unchanged. Principle: "Clean Context Boundary"

