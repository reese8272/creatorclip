scenario: run_on_backward_snap
kind: snap
description: >
  Issue 456 (SEV1) repro: candidate {setup 225, peak 300, end 320} with a 30 s
  unpunctuated run-on utterance (205-235) spanning the setup region. The
  run-on's sentence start is 95 s before the peak; pre-fix the absolute
  never-mid-sentence rule dragged the start there and the 90 s length clamp
  then cut the end at setup+90 — shipping [204.7, 294.7] with the detected
  peak at 300 entirely OUTSIDE the delivered clip. Bounded snapping must keep
  the raw start (a mid-sentence open is recoverable in review; a clip without
  its peak is not) and the persisted window must contain the peak.
  Principle: "Clip the setup, not the aftermath"

