scenario: fake_boundary_negation
kind: snap
description: >
  Issue 484, the live meaning-inverting cold open (video 7e988321 rank 9):
  Deepgram ended an utterance between "don't" and "feel", so the sentence
  index opened a span at "feel" — a strong opener — and the pause branch kept
  the raw start untouched. The clip shipped "feel like Percy Butler is a
  starting free anything", the OPPOSITE of what the speaker said. The word
  before the boundary carries no terminal punctuation and the gap is 0.9 s:
  a fake (pause-only) boundary, not a grammatical one. The sentence must
  continue across it, so the open lands before the negation. Principle:
  "Clean Context Boundary"

