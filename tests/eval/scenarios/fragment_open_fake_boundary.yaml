scenario: fragment_open_fake_boundary
kind: snap
description: >
  Issue 484 / the Issue-441 fragment class (video 7e988321 rank 7): a clip
  opened cold on the fragment "the Terry thing, no." The word before the
  boundary is "but" — a coordinator, deliberately absent from the weak-opener
  list (Issue 441 dropped coordinators because "But I think…" is a fine
  open). The defect is the boundary again: "but" carries no terminal
  punctuation and the pause is 0.9 s, so the fragment is the tail of the
  previous sentence, split by Deepgram on a pause. Merging the fake boundary
  restores the full thought — while "but" stays a legal opener elsewhere.
  Principle: "Clean Context Boundary"

