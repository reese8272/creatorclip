scenario: dependent_clause_open
kind: snap
description: >
  Issue 441, from video 3b6992fe: rank 3 ended "...I worry about this room some
  because" and rank 2 opened "because they still don't know what Mikey is." The
  engine split one sentence across two clips and the second opened on a bare
  subordinating conjunction. Crucially this is NOT the Issue-428 mid-sentence
  cut — Deepgram splits utterances on PAUSES rather than grammar, so the
  "because..." utterance IS a first-class sentence start and the existing
  starts_on_sentence_start assertion passes on it trivially. The opening TOKEN
  is what fails: a clause introduced by "because" cannot stand alone, so the
  open must walk back far enough to carry the main clause it depends on.
  Principle: "Clean Context Boundary"

