name: LLM E2E Nightly

# Issue 319 — End-to-end live-API LLM verification harness.
#
# Runs the llm_live test suite nightly against the real Anthropic API to verify:
#   - Correct structured output from every LLM feature module
#   - Honesty disclaimer present in every response
#   - Prompt cache landing (cache_read_input_tokens > 0 on 2nd same-creator call)
#   - Usage dict recorded (non-empty)
#   - Typed SDK exceptions raised (not bare Exception) on bad requests
#   - No PII / API key in captured log output
#
# This workflow is intentionally NOT triggered on push or pull_request — it is
# cost-metered (real Anthropic API calls) and bound to nightly or manual dispatch
# only. PR-gating runs a separate mocked suite (ci.yml) that covers the same
# logic without live API spend.
#
# Job runs on ubuntu-latest (GitHub-hosted) so it is not dependent on the
# self-hosted runner's availability. No Docker / Postgres needed — the tests
# import modules directly and stub the DB with env-var stubs.

on:
  schedule:
    # 03:00 UTC daily — off-peak, avoids quota contention with daytime workflows
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Allows manual triggering from the Actions UI; useful for pre-launch smoke tests

jobs:
  llm-e2e:
    name: LLM end-to-end (live API)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # conftest.py fail-fasts without a live Redis (slowapi has no in-memory
    # fallback) — the nightly ran red from 2026-07-02 until this service was
    # added: exit 4 at collection, the harness never executed.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Issue 504 — `${{ secrets.X }}` expands to "" when the secret is unset,
      # renamed or blanked. Both lanes below gate on bool(KEY), so an empty
      # secret skips every test, pytest exits 0, and the whole nightly reports
      # green having made zero live calls — while docs/GO_LIVE.md cites it as
      # proof the external APIs are live. Fail here instead, loudly, BEFORE the
      # lanes get a chance to look successful. Never echo the values.
      - name: Verify live-API secrets are present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: |
          missing=""
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$DEEPGRAM_API_KEY" ] || missing="$missing DEEPGRAM_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Empty repository secret(s):$missing — the live lanes would" \
                 "skip every test and report green. Set them in Settings > Secrets."
            exit 1
          fi
          echo "Both live-API secrets are non-empty."

      - name: Run llm_live tests
        env:
          RUN_LLM_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Stub env vars required by config.py (no real DB/Redis needed)
          # Must be BYTE-IDENTICAL to conftest.py's _DEFAULT_DB — any difference makes
          # the Postgres fail-fast guard treat it as an explicit override and probe a
          # DB this job doesn't have (the 2026-07-03 exit-4 after the Redis fix).
          DATABASE_URL: "postgresql+psycopg://creatorclip:dev_password@localhost:5432/creatorclip"
          REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_OAUTH_CLIENT_ID: "stub"
          GOOGLE_OAUTH_CLIENT_SECRET: "stub"
          OAUTH_REDIRECT_URI: "http://localhost:8000/auth/callback"
          TOKEN_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          JWT_SECRET_KEY: "stub-jwt-secret-32-bytes-minimum-!"
          ALLOWED_ORIGINS: "http://localhost:8000"
          LOG_DIR: ""
        run: |
          # -s: the Issue-476 scoring lane prints SCORING-MARGIN lines that the
          # step summary below greps — captured stdout would swallow them.
          python -m pytest tests/test_llm_live.py tests/test_llm_live_scoring.py \
            -m llm_live \
            -v \
            -s \
            --tb=short \
            --no-header \
            --junitxml=llm_e2e_junit.xml \
            2>&1 | tee llm_e2e_results.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Issue 504 — assert what RAN, not what was collected. skipif is
          # evaluated after collection, so a fully-skipped lane still reports its
          # full --collect-only count; only the JUnit report separates the two.
          # Runs before the exit below so an empty lane fails even when pytest
          # itself was perfectly happy. Floor is a ratchet: 9 live tests as of
          # 2026-08-20 (the 2026-08-17 run made 9 live calls). Raise it when the
          # lane grows; lowering it needs a reason in the commit message.
          python scripts/assert_tests_executed.py llm_e2e_junit.xml 9
          exit $EXIT_CODE

      - name: Run transcription_live tests (Issue 481)
        # Live ASR timing-fidelity leg: re-transcribes the checked-in 5 s
        # LibriSpeech fixture against real Deepgram and asserts every word
        # timing within ±0.25 s of tests/fixtures/transcription/
        # expected_words.json. One tiny metered call per night; rides this
        # nightly (same schedule, same stub-env needs) instead of a separate
        # workflow. `if: always()` keeps the ASR signal independent of an LLM
        # failure; a red here still fails the job.
        if: always()
        env:
          RUN_TRANSCRIPTION_LIVE: "1"
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ANTHROPIC_API_KEY: "stub"
          DATABASE_URL: "postgresql+psycopg://creatorclip:dev_password@localhost:5432/creatorclip"
          REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_OAUTH_CLIENT_ID: "stub"
          GOOGLE_OAUTH_CLIENT_SECRET: "stub"
          OAUTH_REDIRECT_URI: "http://localhost:8000/auth/callback"
          TOKEN_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          JWT_SECRET_KEY: "stub-jwt-secret-32-bytes-minimum-!"
          ALLOWED_ORIGINS: "http://localhost:8000"
          LOG_DIR: ""
        run: |
          python -m pytest tests/ingestion/test_transcription_live.py \
            -m transcription_live \
            -v \
            --tb=short \
            --no-header \
            --junitxml=transcription_live_junit.xml \
            2>&1 | tee transcription_live_results.txt
          EXIT_CODE=${PIPESTATUS[0]}
          # Issue 504 — same executed-count guard as the LLM lane above. One
          # metered ~5 s Deepgram transcription per night; floor 1.
          python scripts/assert_tests_executed.py transcription_live_junit.xml 1
          exit "$EXIT_CODE"

      - name: Post result summary
        if: always()
        run: |
          RESULT_FILE=llm_e2e_results.txt
          if [ -f "$RESULT_FILE" ]; then
            echo "## LLM E2E Nightly Results" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Issue 476 — the scoring behavioral lane prints one SCORING-MARGIN
            # line per ordering probe (classes A/B/C in test_llm_live_scoring.py).
            echo "## Scoring behavioral lane" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep "SCORING-MARGIN" "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY" \
              || echo "No SCORING-MARGIN lines — scoring lane did not run." >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## LLM E2E Nightly Results" >> "$GITHUB_STEP_SUMMARY"
            echo "No result file found — test step may have failed to start." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "## Transcription live (Issue 481)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f transcription_live_results.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -10 transcription_live_results.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No ASR result file — the transcription_live step did not run." >> "$GITHUB_STEP_SUMMARY"
          fi
