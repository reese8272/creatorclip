name: Mutation Testing (cadence)

# Issue 273 — REPORT-only, scheduled (NOT per-PR). Mutation testing proves the
# unit tests ASSERT on the load-bearing core (clip_engine scoring comparisons,
# recency-decay math, decrypt()). Slow + memory-sensitive, so weekly + manual only.
# Deliberately NOT a pull_request/push trigger: it must never gate a merge and must
# stay OUT of the required-status set so it can never red-wall an unrelated PR.
on:
  schedule:
    - cron: "0 7 * * 1" # 07:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation score — load-bearing core (>80% target)
    # GitHub-hosted (Issue 360): only deploy-track workflows (deploy.yml,
    # docker-publish.yml, staging-drills.yml) may use the prod-VM self-hosted
    # runner. This job is non-gating and weekly, so a hosted-minutes billing
    # fast-fail costs a report, never a merge.
    runs-on: ubuntu-latest
    # The unit lane talks to a real Redis (slowapi limiter, no in-memory fallback),
    # so mutmut's runner needs Redis up. Postgres is deliberately NOT provisioned:
    # the runner pins `-m 'not integration'`, so an accidental DB hit fails loudly
    # rather than silently mutating against a live database.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run mutmut (scoped to the load-bearing core)
        # Issue 502/503 — this was `mutmut run || true`, which reported success on
        # 8/8 weekly runs having never executed a single mutant: the run crashed in
        # stats collection (a missing module in `also_copy`) and `|| true` ate it.
        #
        # Survivors must still not fail the job — this workflow is REPORT-only
        # (Issue 273) and must never gate a merge. So the exit code is captured and
        # deliberately not propagated: "ran and found survivors" and "could not run"
        # are DIFFERENT states, and only the second is a failure. Same split as
        # run_layer0.py's `_COMPLETED_EXIT_CODES` allow-list (Issue 499) — a non-zero
        # exit is the normal "found things" state there too.
        run: |
          set +e
          mutmut run --max-children 4
          echo "mutmut exit: $?  (survivors are expected and non-fatal)"
      - name: Publish mutation score to the job summary
        if: always()
        # Reads mutants/**/*.py.meta and FAILS if zero mutants ran. `mutmut results`
        # cannot be trusted for this: it prints only SURVIVORS, so a run that died
        # before mutating anything emits the same empty block as a run that killed
        # every mutant — which reads as a perfect score.
        #
        # No pipe into `tee` here: a pipeline's exit status is the LAST command's,
        # so `script | tee` would discard the very failure this step exists to
        # raise — the same swallowing as `|| true`, wearing a different hat.
        run: |
          set +e
          python scripts/mutation_score.py --min 500 --summary "$GITHUB_STEP_SUMMARY" \
            > mutmut_results.txt 2>&1
          SCORE_STATUS=$?
          set -e
          cat mutmut_results.txt
          echo "" >> mutmut_results.txt
          echo "--- surviving mutants ---" >> mutmut_results.txt
          mutmut results >> mutmut_results.txt
          exit $SCORE_STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-results
          path: mutmut_results.txt
